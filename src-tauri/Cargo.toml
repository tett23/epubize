[package]
name = "epubize"
version = "0.1.0"
description = "Web 小説を EPUB にするツールと管理 GUI"
authors = ["tett23"]
license = "MIT"
edition = "2024"
default-run = "epubize"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epubize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
dirs = "7.0.0"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "clock"] }
jsonschema = { version = "0.58.6", default-features = false }
base64 = "0.23.1"
regex = "1.13.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
