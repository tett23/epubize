<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img">
<title>epubize のワークフロー</title>
<desc>Tauri のバックエンドが各段を動かす。Web 小説サイトから novel-crawler が取得し、JSON Lines を SQLite に取り込む。SQLite から作ったプロジェクト一式を epub-builder が EPUB 3.0 にする。EPUB は、そのままダウンロードするか、kindlegen と striptool で MOBI にするか、send-to-kindle で Kindle に送る。</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; dominant-baseline: central; }
.t { font-size: 14px; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; fill: #5F5E5A; }
.line { stroke: #888780; stroke-width: 1; fill: none; }
.dash { stroke: #888780; stroke-width: 0.75; stroke-dasharray: 4 4; fill: none; }
.head { stroke: #888780; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.purple .th { fill: #3C3489; }
.purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; }
.teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.gray .th, .gray .t { fill: #444441; }
.gray .ts { fill: #5F5E5A; }
@media (prefers-color-scheme: dark) {
  .t { fill: #E8E6DF; }
  .ts { fill: #B4B2A9; }
  .line, .dash, .head { stroke: #9C9A92; }
  .purple rect { fill: #3C3489; stroke: #AFA9EC; }
  .purple .th { fill: #EEEDFE; }
  .purple .ts { fill: #CECBF6; }
  .teal rect { fill: #085041; stroke: #5DCAA5; }
  .teal .th { fill: #E1F5EE; }
  .teal .ts { fill: #9FE1CB; }
  .gray rect { fill: #444441; stroke: #B4B2A9; }
  .gray .th, .gray .t { fill: #F1EFE8; }
  .gray .ts { fill: #D3D1C7; }
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker>
</defs>
<g class="purple">
<rect x="20" y="20" width="170" height="56" rx="8"/>
<text class="th" x="105" y="38" text-anchor="middle">画面</text>
<text class="ts" x="105" y="58" text-anchor="middle">React</text>
</g>
<line class="line" x1="105" y1="76" x2="105" y2="98" marker-end="url(#arrow)"/>
<text class="ts" x="113" y="87">invoke</text>
<g class="purple">
<rect x="20" y="100" width="170" height="372" rx="12"/>
<text class="th" x="105" y="122" text-anchor="middle">Tauri（Rust）</text>
<text class="ts" x="105" y="148" text-anchor="middle">取得のキュー</text>
<text class="ts" x="105" y="234" text-anchor="middle">取り込み・保存</text>
<text class="ts" x="105" y="328" text-anchor="middle">書き出し</text>
<text class="ts" x="105" y="438" text-anchor="middle">送信・ダウンロード</text>
</g>
<line class="dash" x1="190" y1="148" x2="328" y2="148" marker-end="url(#arrow)"/>
<line class="dash" x1="190" y1="234" x2="328" y2="234" marker-end="url(#arrow)"/>
<line class="dash" x1="190" y1="328" x2="328" y2="328" marker-end="url(#arrow)"/>
<line class="dash" x1="190" y1="438" x2="228" y2="438" marker-end="url(#arrow)"/>
<g class="gray">
<rect x="330" y="20" width="230" height="44" rx="8"/>
<text class="t" x="445" y="42" text-anchor="middle">Web 小説サイト</text>
</g>
<line class="line" x1="445" y1="64" x2="445" y2="118" marker-end="url(#arrow)"/>
<text class="ts" x="453" y="91">HTTP</text>
<g class="teal">
<rect x="330" y="120" width="230" height="56" rx="8"/>
<text class="th" x="445" y="138" text-anchor="middle">novel-crawler</text>
<text class="ts" x="445" y="158" text-anchor="middle">toc・episode・image</text>
</g>
<line class="line" x1="445" y1="176" x2="445" y2="208" marker-end="url(#arrow)"/>
<text class="ts" x="453" y="192">JSON Lines</text>
<g class="gray">
<rect x="330" y="210" width="230" height="48" rx="8"/>
<text class="t" x="445" y="234" text-anchor="middle">SQLite（作品・話・挿絵）</text>
</g>
<line class="line" x1="445" y1="258" x2="445" y2="298" marker-end="url(#arrow)"/>
<text class="ts" x="453" y="278">プロジェクト一式</text>
<g class="teal">
<rect x="330" y="300" width="230" height="56" rx="8"/>
<text class="th" x="445" y="318" text-anchor="middle">epub-builder</text>
<text class="ts" x="445" y="338" text-anchor="middle">Deno・EPUB を生成</text>
</g>
<path class="line" d="M445 356 L445 383 L298 383 L298 408" marker-end="url(#arrow)"/>
<line class="line" x1="445" y1="383" x2="445" y2="408" marker-end="url(#arrow)"/>
<path class="line" d="M445 383 L592 383 L592 408" marker-end="url(#arrow)"/>
<text class="ts" x="453" y="369">EPUB 3.0</text>
<g class="gray">
<rect x="230" y="410" width="136" height="56" rx="8"/>
<text class="th" x="298" y="428" text-anchor="middle">download epub</text>
<text class="ts" x="298" y="448" text-anchor="middle">~/Downloads へ</text>
</g>
<g class="teal">
<rect x="377" y="410" width="136" height="56" rx="8"/>
<text class="th" x="445" y="428" text-anchor="middle">kindlegen ほか</text>
<text class="ts" x="445" y="448" text-anchor="middle">MOBI にする</text>
</g>
<g class="teal">
<rect x="524" y="410" width="136" height="56" rx="8"/>
<text class="th" x="592" y="428" text-anchor="middle">send-to-kindle</text>
<text class="ts" x="592" y="448" text-anchor="middle">SMTP で Kindle へ</text>
</g>
<text class="ts" x="20" y="506">紫: epubize　緑: 子プロセスとして起動するプログラム　灰: データと出口　点線: Tauri が動かす</text>
</svg>
